<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Service • ATHR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --dark: #082d27;
      --main: #1c5949;
      --gold: #8d6e27;
      --gold-light: #dcc27e;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --stroke: rgba(255, 255, 255, 0.12);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Urbanist, system-ui, Segoe UI, Roboto, Arial, Helvetica, sans-serif;
      background: var(--main);
      color: var(--text);
    }

    body {
      overflow-x: hidden;
    }

    .request-content {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(220, 194, 126, 0.12), transparent 34%),
        linear-gradient(135deg, #1c5949 0%, #082d27 100%);
    }

    .home-fab {
      position: fixed;
      left: 26px;
      top: 22px;
      z-index: 50;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: var(--gold);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      text-decoration: none;
      transition: 0.25s ease;
    }

    .home-fab:hover {
      transform: translateY(-2px);
      background: var(--gold-light);
      color: #082d27;
    }

    .stage {
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .switcher {
      width: min(1200px, 95vw);
      min-height: min(720px, 88vh);
      background: var(--dark);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: 0 34px 90px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.08fr 1fr;
      grid-template-areas: "visual content";
      transition: 0.5s ease;
    }

    .switcher.show-form {
      grid-template-columns: 1fr 1.08fr;
      grid-template-areas: "content visual";
    }

    .visual {
      grid-area: visual;
      position: relative;
      background: rgba(0, 0, 0, 0.08);
      display: grid;
      place-items: center;
      overflow: hidden;
      min-height: 420px;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("img/hero.jpg") center/cover no-repeat;
      opacity: 0.35;
      mix-blend-mode: screen;
      transform: scale(1.05);
      transition: transform 0.6s ease;
    }

    .switcher.show-form .visual::before {
      transform: scale(1.1);
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 45, 39, 0.08), rgba(8, 45, 39, 0.72));
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      z-index: 2;
      width: min(520px, 74%);
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 24px 70px rgba(0, 0, 0, 0.45);
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .logo-wrap img {
      max-width: 75%;
      max-height: 120px;
      object-fit: contain;
    }

    .content {
      grid-area: content;
      padding: clamp(28px, 4vw, 52px);
      display: flex;
      align-items: center;
      overflow-y: auto;
    }

    .intro,
    .form-card {
      width: 100%;
    }

    .intro h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 4vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .intro p {
      color: var(--gold-light);
      margin: 0 0 24px;
      font-size: clamp(16px, 1.4vw, 19px);
      line-height: 1.7;
      max-width: 520px;
    }

    .point {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--muted);
      margin: 13px 0;
      font-size: 16px;
      line-height: 1.5;
    }

    .point i {
      color: var(--gold-light);
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      min-height: 48px;
      padding: 13px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      background: var(--gold);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
      transition: 0.25s ease;
      font-family: inherit;
      font-size: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: var(--gold-light);
      color: #082d27;
    }

    .btn-ghost {
      background: transparent;
      color: #ffffff;
      box-shadow: none;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .form-card {
      max-width: 760px;
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: clamp(20px, 3vw, 30px);
      background: rgba(255, 255, 255, 0.035);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 20px 60px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .form-title {
      margin: 0;
      font-size: clamp(25px, 2vw, 32px);
      color: #ffffff;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      gap: 15px;
      grid-template-columns: 1fr 1fr;
    }

    .grid .full {
      grid-column: 1 / -1;
    }

    .input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(141, 110, 39, 0.92);
      color: #ffffff;
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .input::placeholder,
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.75);
    }

    select option {
      color: #082d27;
      background: #ffffff;
    }

    .input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 3px rgba(220, 194, 126, 0.18);
      background: rgba(141, 110, 39, 1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .drop {
      border: 2px dashed rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 16px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .drop:hover {
      border-color: var(--gold-light);
      background: rgba(255, 255, 255, 0.06);
    }

    .drop i {
      margin-right: 8px;
      color: var(--gold-light);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .actions .btn {
      flex: 0 0 auto;
    }

    .slide {
      transition: transform 0.45s cubic-bezier(0.22, 0.82, 0.18, 1);
    }

    .slide.to-left {
      transform: translateX(-24px);
    }

    .slide.to-right {
      transform: translateX(24px);
    }

    @media (max-width: 992px) {
      .stage {
        padding: 22px;
        place-items: start center;
      }

      .switcher,
      .switcher.show-form {
        width: min(760px, 96vw);
        min-height: auto;
        grid-template-columns: 1fr;
        grid-template-areas:
          "visual"
          "content";
      }

      .visual {
        min-height: 300px;
      }

      .content {
        padding: 30px;
      }

      .logo-wrap {
        width: min(420px, 78%);
      }
    }

    @media (max-width: 680px) {
      .home-fab {
        left: 16px;
        top: 16px;
        width: 42px;
        height: 42px;
      }

      .stage {
        padding: 76px 14px 18px;
      }

      .switcher,
      .switcher.show-form {
        width: 100%;
        border-radius: 22px;
      }

      .visual {
        min-height: 220px;
      }

      .logo-wrap {
        width: 82%;
        border-radius: 18px;
        padding: 18px;
      }

      .logo-wrap img {
        max-height: 82px;
      }

      .content {
        padding: 24px 18px;
      }

      .intro h1 {
        font-size: 31px;
      }

      .intro p {
        font-size: 15px;
      }

      .point {
        font-size: 14.5px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .form-card {
        padding: 20px 16px;
        border-radius: 18px;
      }

      .actions {
        flex-direction: column;
      }

      .actions .btn {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .stage {
        padding-inline: 10px;
      }

      .content {
        padding: 22px 14px;
      }

      .intro h1 {
        font-size: 28px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="request-content">
    <a class="home-fab" href="index.html" title="Back to Home">
      <i class="fa-solid fa-house"></i>
    </a>

    <main class="stage">
      <section class="switcher" id="switcher">

        <div class="visual">
          <div class="logo-wrap Hulul">
            <img src="img/005.png" alt="ATHR" />
          </div>
        </div>

        <div class="content">

          <div class="intro" id="introPane">
            <h1>Let's build something great together</h1>
            <p>Share your project and our team will get back within 24 hours.</p>

            <div class="point">
              <i class="fa-solid fa-circle-check"></i>
              <span>Dedicated account manager</span>
            </div>

            <div class="point">
              <i class="fa-solid fa-circle-check"></i>
              <span>Clear timelines & transparent pricing</span>
            </div>

            <div class="point">
              <i class="fa-solid fa-circle-check"></i>
              <span>Measurable results & on-going support</span>
            </div>

            <div style="margin-top: 24px;">
              <button class="btn" id="startBtn" type="button">
                <i class="fa-regular fa-pen-to-square"></i>
                Request Service
              </button>
            </div>
          </div>

          <div class="form-card" id="formPane" style="display: none;">
            <div class="form-header">
              <h2 class="form-title">Request Service</h2>
            </div>

            <form id="reqForm" class="slide" onsubmit="event.preventDefault(); alert('Submitted ✔');">
              <div class="grid">
                <div>
                  <label>Full name *</label>
                  <input class="input" type="text" required placeholder="Your name">
                </div>

                <div>
                  <label>Email *</label>
                  <input class="input" type="email" required placeholder="you@email.com">
                </div>

                <div>
                  <label>Phone</label>
                  <input class="input" type="tel" placeholder="+20 1X XXX XXXX">
                </div>

                <div>
                  <label>Company</label>
                  <input class="input" type="text" placeholder="Company Name">
                </div>

                <div>
                  <label>Service *</label>
                  <select class="input" required>
                    <option value="" selected disabled>Select a service</option>
                    <option>Digital Marketing</option>
                    <option>Creative Services</option>
                    <option>Web Development</option>
                    <option>Influencer Marketing</option>
                    <option>Media Production</option>
                    <option>Media Coverage</option>
                    <option>Outdoor Advertising</option>
                    <option>Printing</option>
                    <option>Audio Production</option>
                    <option>Training & Workshops</option>
                  </select>
                </div>

                <div>
                  <label>Budget</label>
                  <select class="input">
                    <option selected disabled>Select</option>
                    <option>$1k–$3k</option>
                    <option>$3k–$7k</option>
                    <option>$7k–$15k</option>
                    <option>$15k+</option>
                  </select>
                </div>

                <div>
                  <label>Timeline</label>
                  <select class="input">
                    <option>Flexible</option>
                    <option>ASAP</option>
                    <option>2–4 weeks</option>
                    <option>1–3 months</option>
                  </select>
                </div>

                <div class="full">
                  <label>Project brief</label>
                  <textarea class="input" placeholder="Goals, audience, references, must-haves..."></textarea>
                </div>

                <div class="full">
                  <label>Attach file optional</label>
                  <div class="drop">
                    <i class="fa-regular fa-folder-open"></i>
                    Drag & drop or <u>browse</u>
                  </div>
                </div>
              </div>

              <div class="actions">
                <button class="btn" type="submit">
                  <i class="fa-solid fa-paper-plane"></i>
                  Submit
                </button>

                <button class="btn btn-ghost" type="button" id="backBtn">
                  <i class="fa-solid fa-arrow-left-long"></i>
                  Back
                </button>
              </div>
            </form>
          </div>

        </div>
      </section>
    </main>
  </div>

  <script>
    const switcher = document.getElementById("switcher");
    const startBtn = document.getElementById("startBtn");
    const backBtn = document.getElementById("backBtn");
    const introPane = document.getElementById("introPane");
    const formPane = document.getElementById("formPane");

    startBtn.addEventListener("click", function () {
      switcher.classList.add("show-form");
      introPane.style.display = "none";
      formPane.style.display = "block";
    });

    backBtn.addEventListener("click", function () {
      switcher.classList.remove("show-form");
      formPane.style.display = "none";
      introPane.style.display = "block";
    });
  </script>
</body>
</html>
